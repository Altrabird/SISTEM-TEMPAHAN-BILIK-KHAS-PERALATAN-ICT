<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background with brand gradient -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Calendar shape -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hook handles top -->
    <line x1="160" y1="120" x2="160" y2="180"/>
    <line x1="352" y1="120" x2="352" y2="180"/>
    <!-- Calendar body -->
    <rect x="100" y="160" width="312" height="272" rx="32" fill="#ffffff" stroke="none"/>
    <!-- Header strip -->
    <rect x="100" y="160" width="312" height="64" rx="32" fill="#1e3a8a" stroke="none"/>
    <!-- Hook handles re-drawn over header -->
    <line x1="160" y1="120" x2="160" y2="208" stroke="#ffffff" stroke-width="22"/>
    <line x1="352" y1="120" x2="352" y2="208" stroke="#ffffff" stroke-width="22"/>
  </g>
  <!-- Big "T" letter -->
  <text x="256" y="380"
        text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="900"
        font-size="180"
        fill="#2563eb">T</text>
</svg>
