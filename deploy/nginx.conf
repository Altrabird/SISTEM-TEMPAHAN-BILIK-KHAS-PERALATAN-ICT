# =============================================================================
# Nginx site config for tempah.altrabird.click
#
# Place at: /etc/nginx/sites-available/tempah.altrabird.click
# Symlink:  ln -s /etc/nginx/sites-available/tempah.altrabird.click \
#                 /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
# =============================================================================

# HTTP — redirects to HTTPS (Certbot will auto-add the TLS block below)
server {
    listen 80;
    listen [::]:80;
    server_name tempah.altrabird.click;

    # Web root after `npm run build` is uploaded here
    root /var/www/tempah/dist;
    index index.html;

    # Gzip / Brotli — small JS bundle is already gzipped at build time,
    # but enable here for HTML / CSS / JSON.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Long cache for hashed assets (filenames change every build)
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # PWA manifest — always fetch fresh (changes when icons/name update)
    # and serve with the correct MIME type so iOS treats it as installable.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Service worker — never cache (must be fresh to detect updates)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Single-page app fallback — every unknown route serves index.html
    # so the React router (and ?loan=ast-X QR deep-links) work after refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Hide nginx version
    server_tokens off;

    # Reasonable upload limit (avatars / room photos are auto-resized client-side
    # but raw camera shots can be 10 MB)
    client_max_body_size 12M;
}
